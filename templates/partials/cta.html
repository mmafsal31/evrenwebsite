{% if cta_section %}
<section class="py-5">
    <div class="container">
        <div class="premium-card p-4 p-lg-5 overflow-hidden">
            <div class="row align-items-center g-4">
                <div class="col-lg-8">
                    <span class="section-subtitle">Admissions Open</span>
                    <h2 class="mb-3">{{ cta_section.title }}</h2>
                    {% if cta_section.subtitle %}
                    <p class="lead text-muted mb-0">{{ cta_section.subtitle }}</p>
                    {% endif %}
                </div>
                <div class="col-lg-4 text-lg-end">
                    <a href="{{ cta_section.button_link }}" class="btn btn-accent">
                        {{ cta_section.button_text }}
                        <i class="fas fa-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endif %}
